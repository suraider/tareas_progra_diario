<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YouTube</title>
    <link rel="stylesheet" href="/ejercicio_grid/ejemplo_gemini/index.css">
</head>
<body>

    <header class="header">
        <div class="logo-section">
            <div class="menu-icon">☰</div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo" class="logo">
        </div>
        
        <div class="search-section">
            <input type="text" placeholder="Buscar">
            <button>🔍</button>
        </div>

        <div class="icons-section">
            <span>🔔</span>
            <div class="user-avatar"></div>
        </div>
    </header>

    <div class="main-container">
        <nav class="sidebar">
            <div class="nav-item active">Inicio</div>
            <div class="nav-item">Shorts</div>
            <div class="nav-item">Suscripciones</div>
            <hr>
            <div class="nav-item">Biblioteca</div>
            <div class="nav-item">Historial</div>
        </nav>

        <main class="video-grid">
            <div class="video-card">
                <div class="thumbnail"></div>
                <div class="video-info">
                    <div class="channel-icon"></div>
                    <div class="text-info">
                        <h3>Aprende Flexbox y Grid desde cero</h3>
                        <p>Canal de Desarrollo</p>
                        <p>1.2 M de vistas • hace 2 horas</p>
                    </div>
                </div>
            </div>
            </main>
    </div>

</body>
</html>
